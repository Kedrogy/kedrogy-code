[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "label-train-serve"
version = "0.1"
dependencies = [
    "django>=6.0.1",
    "django-htmx>=1.27.0",
    "django-tasks",#see tool.uv.sources
    "psycopg[binary,pool]",
    "jinja2",
]
description = "A Django apps."
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
    {name = "Team Ysz", email = "team@ysz.vc"},
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://www.example.com/"

# [tool.setuptools.packages.find]
# exclude = ['notebooks*', 'label_train_serve_site*']

[tool.uv]
package = true

[tool.uv.sources]
django-tasks = { git = "ssh://git@github.com/RealOrangeOne/django-tasks.git", rev = "4377f2c" }
# add like this
# uv add --package django-dataset-new git+ssh://github.com/RealOrangeOne/django-tasks.git --rev 4377f2c
