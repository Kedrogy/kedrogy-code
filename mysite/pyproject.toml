[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mysite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.1",
    "label-train-serve",
]

[tool.uv.sources]
label-train-serve = { path = "../label-train-serve", editable = true }

# uv does not support transitive dev dependencies , so 
[dependency-groups]
dev = [
    "django-extensions>=4.1",

    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",

    # XXX CommandError: Could not load shell runner: 'IPython Notebook' https://github.com/django-extensions/django-extensions/issues/1835#issuecomment-3035536658
    "notebook==6.5.4",
    "traitlets==5.9.0",
]

[tool.uv]
package = true

