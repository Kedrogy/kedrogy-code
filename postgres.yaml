apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 30001
          env:
            - name: PGPORT
              value: "30001"
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              value: postgres
            # compose.yaml
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            # different name for the default database that is created when the image is first started
            - name: POSTGRES_DB
              value: mysite

          # see compose.yaml
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: postgres-volume
      volumes:
        - name: postgres-volume
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  labels:
    app: postgres
spec:
  # XXX
  type: LoadBalancer
  ports:
    - port: 30001
      targetPort: 30001
  selector:
    app: postgres
