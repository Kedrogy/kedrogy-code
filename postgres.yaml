{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "postgres-pvc",
        "labels": {
          "app": "postgres"
        }
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "postgres-deployment",
        "labels": {
          "app": "postgres"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "postgres"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "postgres"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "postgres",
                "image": "postgres:18",
                "env": [
                  {
                    "name": "PGPORT",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "kedrogy-db-admin",
                        "key": "PGPORT"
                      }
                    }
                  },
                  {
                    "name": "PGUSER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "kedrogy-db-admin",
                        "key": "PGUSER"
                      }
                    }
                  },
                  {
                    "name": "PGPASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "kedrogy-db-admin",
                        "key": "PGPASSWORD"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "kedrogy-db-admin",
                        "key": "PGUSER"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "kedrogy-db-admin",
                        "key": "PGPASSWORD"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_DB",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "kedrogy-db-admin",
                        "key": "PGDATABASE"
                      }
                    }
                  }
                ],
                "ports": [
                  {
                    "containerPort": 30001
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "postgres-volume",
                    "mountPath": "/var/lib/postgresql"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "postgres-volume",
                "persistentVolumeClaim": {
                  "claimName": "postgres-pvc"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "postgres-svc",
        "labels": {
          "app": "postgres"
        }
      },
      "spec": {
        "type": "LoadBalancer",
        "selector": {
          "app": "postgres"
        },
        "ports": [
          {
            "port": 30001,
            "targetPort": 30001
          }
        ]
      }
    }
  ]
}
