all_data_jsonl:
  type: ysz.kedro_datasets.srsly_dataset.SrslyDataset
  filepath: data/01_raw/all_data.jsonl

all_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/all_data.csv
  save_args:
    index: False
    quoting: 1 #csv.QUOTE_ALL

all_data_postgres:
  type: pandas.SQLTableDataset
  credentials: db_credentials
  table_name: all_data
  save_args:
    if_exists: replace
