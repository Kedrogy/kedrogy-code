# Local profile. The manifest generator supplies the deployment variant.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    location /static/ { alias /usr/share/nginx/static/; }
    location = /legacy/ { proxy_pass http://mysite-svc:8000/; include /etc/nginx/proxy_params_kedrogy; }
    location ~ ^/(api/|admin/|health/|i18n/|logout/|(?:en|ru)/|[0-9]+/|model/|new_|train_model/|serve_model/|stop_model/|predict_model/|delete_|label_dataset/|legacy_cleanup/|annotation/) {
        proxy_pass http://mysite-svc:8000;
        include /etc/nginx/proxy_params_kedrogy;
    }
    location / { try_files $uri $uri/ /index.html; }
}
