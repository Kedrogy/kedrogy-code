[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "predict"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers==4.57.1",
    "torch>=1.13.1",
    "fastapi[standard]>=0.115.14",
]

[tool.uv]
package = true

[project.scripts]
serve = "predict.serve:main"
