all_data_jsonl:
  type: ysz.kedro_datasets.srsly_dataset.SrslyDataset
  filepath: data/01_raw/all_data.jsonl

all_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/all_data.csv
  load_args:
    dtype: str
    keep_default_na: False
  save_args:
    index: False
    quoting: 1 #csv.QUOTE_ALL

examples_jsonl:
  type: ysz.kedro_datasets.srsly_dataset.SrslyDataset
  filepath: data/00_examples/examples.jsonl

labelled_examples:
  type: ysz.kedro_datasets.srsly_dataset.SrslyDataset
  filepath: data/02_intermediate/labelled_examples.jsonl

dataset_fasttext:
  type: ysz.kedro_datasets.fasttext_dataset.FasttextDataset
  filepath: data/02_intermediate/dataset_fasttext.csv

model_input:
  type: ysz.kedro_datasets.huggingface_dataset.HuggingfaceDataset
  filepath: data/05_model_input
